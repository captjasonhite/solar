<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0714">
<title>Love Dice</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --obsidian:#0d0714;--plum:#2a0f26;--rose:#ff5fa8;--gold:#ffd9a0;--violet:#b07cff;
  --glass:rgba(255,255,255,0.05);
}
html,body{
  position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
  background:radial-gradient(ellipse at 50% 20%,#1c0b22 0%,var(--obsidian) 70%);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color:#f4e9f2;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block}

#hud{position:fixed;inset:0;z-index:10;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 16px);
  display:flex;flex-direction:column;justify-content:space-between}

.top{display:flex;flex-direction:column;align-items:center;gap:8px}
.title{font-size:1.5rem;font-weight:900;letter-spacing:8px;text-transform:uppercase;
  background:linear-gradient(120deg,var(--rose),var(--violet) 60%,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 12px rgba(255,95,168,0.55))}
.chips{display:flex;gap:10px}
.chip{font-size:0.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  padding:6px 14px;border-radius:20px;border:1px solid rgba(255,95,168,0.5);
  background:var(--glass);color:var(--rose);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 14px rgba(255,95,168,0.25),inset 0 0 10px rgba(255,95,168,0.08)}
.chip.spicy{border-color:var(--gold);color:var(--gold);box-shadow:0 0 18px rgba(255,217,160,0.4),inset 0 0 10px rgba(255,217,160,0.1);
  display:none;animation:spiceIn .6s ease}
body.spicy .chip.spicy{display:inline-block}
@keyframes spiceIn{0%{transform:scale(0.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.bottom{display:flex;flex-direction:column;align-items:center;gap:14px}

#result{width:100%;max-width:360px;padding:16px 18px 18px;border-radius:20px;text-align:center;
  background:rgba(20,8,24,0.55);border:1px solid rgba(255,95,168,0.35);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 30px rgba(255,95,168,0.18),inset 0 0 24px rgba(255,95,168,0.06)}
#result .ph{font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;opacity:0.45}
#result .row{margin-top:8px}
#result .lbl{display:block;font-size:0.55rem;letter-spacing:3px;text-transform:uppercase;opacity:0.5;margin-bottom:2px}
#result .val{font-size:1.25rem;font-weight:800;letter-spacing:1px}
#result .val.a{color:var(--rose);text-shadow:0 0 16px rgba(255,95,168,0.8)}
#result .val.b{color:var(--violet);text-shadow:0 0 16px rgba(176,124,255,0.8)}
#result.lit{animation:resultGlow 1.4s ease infinite alternate}
@keyframes resultGlow{from{box-shadow:0 0 24px rgba(255,95,168,0.25),inset 0 0 20px rgba(255,95,168,0.08)}
  to{box-shadow:0 0 48px rgba(255,95,168,0.55),inset 0 0 30px rgba(255,95,168,0.16)}}
#result.pop .val{animation:valPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes valPop{0%{transform:scale(0.3);opacity:0}100%{transform:scale(1);opacity:1}}

#rollBtn{pointer-events:auto;touch-action:manipulation;cursor:pointer;
  width:150px;height:150px;border-radius:50%;
  border:2px solid var(--rose);color:#fff;font-size:0.85rem;font-weight:900;letter-spacing:3px;text-transform:uppercase;
  background:radial-gradient(circle at 35% 30%,rgba(255,95,168,0.35),rgba(42,15,38,0.85) 70%);
  box-shadow:0 0 30px rgba(255,95,168,0.45),inset 0 0 30px rgba(255,95,168,0.2);
  animation:btnPulse 2.2s ease-in-out infinite;transition:transform .12s}
#rollBtn:active{transform:scale(0.92)}
#rollBtn:disabled{opacity:0.4;animation:none;box-shadow:0 0 12px rgba(255,95,168,0.2)}
@keyframes btnPulse{0%,100%{box-shadow:0 0 22px rgba(255,95,168,0.35),inset 0 0 26px rgba(255,95,168,0.15)}
  50%{box-shadow:0 0 50px rgba(255,95,168,0.7),inset 0 0 34px rgba(255,95,168,0.3)}}
.hint{font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;opacity:0.4}

#gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:32px;text-align:center;
  background:radial-gradient(ellipse at 50% 30%,#22102e 0%,var(--obsidian) 75%)}
#gate.hidden{display:none}
#gate h1{font-size:2.2rem;font-weight:900;letter-spacing:10px;text-transform:uppercase;
  background:linear-gradient(120deg,var(--rose),var(--violet) 60%,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,95,168,0.6))}
#gate p{font-size:0.8rem;line-height:1.8;opacity:0.7;max-width:280px}
.gate-btn{pointer-events:auto;touch-action:manipulation;cursor:pointer;width:100%;max-width:280px;
  padding:16px 24px;border-radius:30px;font-size:0.85rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  border:2px solid var(--rose);color:#fff;background:rgba(255,95,168,0.12);
  box-shadow:0 0 24px rgba(255,95,168,0.35);transition:transform .12s}
.gate-btn:active{transform:scale(0.95)}
.gate-btn.ghost{border-color:rgba(255,255,255,0.25);color:rgba(255,255,255,0.6);background:transparent;box-shadow:none;font-size:0.7rem;padding:12px 24px}
#gateStatus{font-size:0.65rem;letter-spacing:1px;opacity:0.5;min-height:1em}

#rotate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:var(--obsidian);color:var(--rose);
  font-size:0.9rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-align:center;padding:20px}
#rotate .icon{font-size:2.4rem;animation:rotHint 1.6s ease-in-out infinite}
@keyframes rotHint{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media (orientation:landscape) and (max-height:500px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="hud">
  <div class="top">
    <div class="title">Love Dice</div>
    <div class="chips">
      <span class="chip" id="roundChip">Round 1</span>
      <span class="chip spicy" id="spiceChip">Spicy Unlocked</span>
    </div>
  </div>
  <div class="bottom">
    <div id="result">
      <span class="ph" id="resultPh">Shake the phone or tap to roll</span>
      <div class="row" id="rowA" style="display:none"><span class="lbl">Action</span><span class="val a" id="valA"></span></div>
      <div class="row" id="rowB" style="display:none"><span class="lbl">Body Part</span><span class="val b" id="valB"></span></div>
    </div>
    <button id="rollBtn">Tap to Roll</button>
    <div class="hint" id="motionHint">Motion controls off &middot; shake to roll once enabled</div>
  </div>
</div>

<div id="gate">
  <h1>Love Dice</h1>
  <p>Two 3D dice in a velvet tray. Shake your phone to roll, or tap the button. Round 4 heats things up.</p>
  <button class="gate-btn" id="enableMotion">Enable Motion Controls</button>
  <button class="gate-btn ghost" id="skipMotion">Skip &middot; Tap to Roll Only</button>
  <div id="gateStatus"></div>
</div>

<div id="rotate"><div class="icon">&#8693;</div>Rotate to portrait</div>

<script>
(function(){
'use strict';

window.addEventListener('error', function(e){
  var el = document.getElementById('gateStatus');
  if (el) el.textContent = 'Load error: ' + (e.message || e.type);
});

var ACTIONS = ['Kiss','Massage','Caress','Nibble','Tease','Tickle'];
var ACTIONS_SPICY = ['Kiss','Suck','Caress','Nipples','Massage','Tease'];
var PARTS = ['Neck','Earlobe','Lips','Shoulders','Back','Thighs'];
var PARTS_SPICY = ['Nipples','Inner Thighs','Lips','Between Legs','Neck','Earlobe'];

var spicy = false;
var rolled = 0;
var rolling = false;
var restFrames = 0;
var rollStart = 0;
var motionOn = false;

var stage = document.getElementById('stage');
var roundChip = document.getElementById('roundChip');
var resultEl = document.getElementById('result');
var resultPh = document.getElementById('resultPh');
var rowA = document.getElementById('rowA');
var rowB = document.getElementById('rowB');
var valA = document.getElementById('valA');
var valB = document.getElementById('valB');
var rollBtn = document.getElementById('rollBtn');
var motionHint = document.getElementById('motionHint');
var gate = document.getElementById('gate');
var gateStatus = document.getElementById('gateStatus');

var renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d0714, 14, 30);

var camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 8.2, 6.8);
camera.lookAt(0, 0.3, 0);

var amb = new THREE.AmbientLight(0x5a2a55, 0.9);
scene.add(amb);
var key = new THREE.PointLight(0xff6fb0, 1.3, 40);
key.position.set(0, 6.5, 0);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
scene.add(key);
var rim = new THREE.PointLight(0x8a5cff, 0.8, 30);
rim.position.set(-5, 3, -4);
scene.add(rim);
var front = new THREE.DirectionalLight(0xffd9ec, 0.35);
front.position.set(0, 4, 8);
scene.add(front);

var world = new CANNON.World();
world.gravity.set(0, -26, 0);
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;

var TRAY_HALF = 1.95;
var WALL_T = 0.35;
var WALL_H = 2.3;
var DIE = 1.0;

function addStaticBox(sx, sy, sz, x, y, z, mat){
  var body = new CANNON.Body({type:CANNON.STATIC, shape:new CANNON.Box(new CANNON.Vec3(sx/2, sy/2, sz/2))});
  body.position.set(x, y, z);
  body.material = new CANNON.Material({friction:0.5, restitution:0.3});
  world.addBody(body);
  var mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
  mesh.position.set(x, y, z);
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  scene.add(mesh);
}

var feltMat = new THREE.MeshStandardMaterial({color:0x3a1230, roughness:0.95, metalness:0.05});
var frameMat = new THREE.MeshStandardMaterial({color:0x150a18, roughness:0.6, metalness:0.35});

addStaticBox(TRAY_HALF*2 + WALL_T*2, 0.7, TRAY_HALF*2 + WALL_T*2, 0, -0.35, 0, feltMat);
addStaticBox(WALL_T, WALL_H, TRAY_HALF*2 + WALL_T*2, -(TRAY_HALF + WALL_T/2), WALL_H/2 - 0.1, 0, frameMat);
addStaticBox(WALL_T, WALL_H, TRAY_HALF*2 + WALL_T*2, (TRAY_HALF + WALL_T/2), WALL_H/2 - 0.1, 0, frameMat);
addStaticBox(TRAY_HALF*2 + WALL_T*2, WALL_H, WALL_T, 0, WALL_H/2 - 0.1, -(TRAY_HALF + WALL_T/2), frameMat);
addStaticBox(TRAY_HALF*2 + WALL_T*2, WALL_H, WALL_T, 0, WALL_H/2 - 0.1, (TRAY_HALF + WALL_T/2), frameMat);

var floorPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({color:0x0d0714, roughness:1})
);
floorPlane.rotation.x = -Math.PI/2;
floorPlane.position.y = -0.72;
scene.add(floorPlane);

var maxAniso = renderer.capabilities.getMaxAnisotropy();

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function makeFaceTexture(word, accent){
  var s = 512;
  var c = document.createElement('canvas');
  c.width = s; c.height = s;
  var ctx = c.getContext('2d');
  var g = ctx.createRadialGradient(s/2, s/2, 40, s/2, s/2, s*0.75);
  g.addColorStop(0, '#4a1738');
  g.addColorStop(0.7, '#260b1e');
  g.addColorStop(1, '#140611');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);

  ctx.strokeStyle = accent;
  ctx.lineWidth = 12;
  ctx.shadowColor = accent;
  ctx.shadowBlur = 30;
  roundRect(ctx, 30, 30, s-60, s-60, 56);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.25;
  roundRect(ctx, 52, 52, s-104, s-104, 42);
  ctx.stroke();
  ctx.globalAlpha = 1;

  var lines = word.split(' ');
  var size = 130;
  var font = function(sz){ return '900 ' + sz + 'px -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'; };
  ctx.font = font(size);
  var maxW = 0;
  for (var i = 0; i < lines.length; i++){
    maxW = Math.max(maxW, ctx.measureText(lines[i]).width);
  }
  while (maxW > s - 130 && size > 34){
    size -= 4;
    ctx.font = font(size);
    maxW = 0;
    for (var j = 0; j < lines.length; j++){
      maxW = Math.max(maxW, ctx.measureText(lines[j]).width);
    }
  }
  ctx.font = font(size);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = accent;
  ctx.shadowBlur = 26;
  var lineH = size * 1.15;
  var startY = s/2 - (lines.length - 1) * lineH / 2;
  for (var k = 0; k < lines.length; k++){
    ctx.fillText(lines[k], s/2, startY + k * lineH);
  }

  var tex = new THREE.CanvasTexture(c);
  tex.anisotropy = maxAniso;
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function makeDieMaterialSet(words, accent){
  var mats = [];
  for (var i = 0; i < 6; i++){
    mats.push(new THREE.MeshStandardMaterial({
      map: makeFaceTexture(words[i], accent),
      roughness: 0.35,
      metalness: 0.15
    }));
  }
  return mats;
}

function disposeMaterials(mesh){
  for (var i = 0; i < mesh.material.length; i++){
    if (mesh.material[i].map) mesh.material[i].map.dispose();
    mesh.material[i].dispose();
  }
}

var dieGeo = new THREE.BoxGeometry(DIE, DIE, DIE);
var die1Mesh = new THREE.Mesh(dieGeo, makeDieMaterialSet(ACTIONS, '#ff5fa8'));
var die2Mesh = new THREE.Mesh(dieGeo, makeDieMaterialSet(PARTS, '#b07cff'));
die1Mesh.castShadow = true;
die2Mesh.castShadow = true;
scene.add(die1Mesh);
scene.add(die2Mesh);

var dieMat = new CANNON.Material({friction:0.4, restitution:0.35});
function makeDieBody(x, y, z){
  var b = new CANNON.Body({
    mass: 1,
    shape: new CANNON.Box(new CANNON.Vec3(DIE/2, DIE/2, DIE/2)),
    material: dieMat,
    linearDamping: 0.12,
    angularDamping: 0.12
  });
  b.position.set(x, y, z);
  b.sleepSpeedLimit = 0.15;
  b.sleepTimeLimit = 0.5;
  world.addBody(b);
  return b;
}
var die1Body = makeDieBody(-0.6, 0.55, 0);
var die2Body = makeDieBody(0.6, 0.55, 0);

var audioCtx = null;
var lastSound = 0;
function ensureAudio(){
  if (!audioCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function thump(impact){
  if (!audioCtx || audioCtx.state !== 'running') return;
  var now = performance.now();
  if (now - lastSound < 45) return;
  lastSound = now;
  var t = audioCtx.currentTime;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(60 + Math.random()*50, t);
  o.frequency.exponentialRampToValueAtTime(35, t + 0.1);
  var vol = Math.min(0.5, 0.08 + impact * 0.04);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.13);
}
function onCollide(e){
  var v = 0;
  try { v = Math.abs(e.contact.getImpactVelocityAlongNormal()); } catch(err){}
  if (v > 0.8) thump(v);
}
die1Body.addEventListener('collide', onCollide);
die2Body.addEventListener('collide', onCollide);

function vibrate(){
  if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
}

function actionsList(){ return spicy ? ACTIONS_SPICY : ACTIONS; }
function partsList(){ return spicy ? PARTS_SPICY : PARTS; }

function roll(){
  if (rolling) return;
  ensureAudio();
  vibrate();
  rolling = true;
  restFrames = 0;
  rollStart = performance.now();

  if (rolled >= 3 && !spicy){
    spicy = true;
    document.body.classList.add('spicy');
    disposeMaterials(die1Mesh);
    die1Mesh.material = makeDieMaterialSet(ACTIONS, '#ff5fa8');
    disposeMaterials(die2Mesh);
    die2Mesh.material = makeDieMaterialSet(PARTS, '#b07cff');
  }

  var spots = [
    [-0.55, 1.3, -0.4],
    [0.55, 1.3, 0.4]
  ];
  var bodies = [die1Body, die2Body];
  for (var i = 0; i < 2; i++){
    var b = bodies[i];
    b.wakeUp();
    b.position.set(spots[i][0] + (Math.random()-0.5)*0.3, spots[i][1] + Math.random()*0.6, spots[i][2] + (Math.random()-0.5)*0.3);
    b.quaternion.setFromEuler(
      Math.random()*Math.PI*2,
      Math.random()*Math.PI*2,
      Math.random()*Math.PI*2
    );
    b.velocity.set(
      (Math.random()-0.5)*9,
      6 + Math.random()*4,
      (Math.random()-0.5)*9
    );
    b.angularVelocity.set(
      (Math.random()-0.5)*22,
      (Math.random()-0.5)*22,
      (Math.random()-0.5)*22
    );
  }

  resultPh.style.display = '';
  rowA.style.display = 'none';
  rowB.style.display = 'none';
  resultEl.classList.remove('lit');
  resultEl.classList.remove('pop');
  rollBtn.disabled = true;
}

function upFaceIndex(body){
  var up = new CANNON.Vec3(0, 1, 0);
  var ax = new CANNON.Vec3(1, 0, 0), ay = new CANNON.Vec3(0, 1, 0), az = new CANNON.Vec3(0, 0, 1);
  body.quaternion.vmult(ax, ax);
  body.quaternion.vmult(ay, ay);
  body.quaternion.vmult(az, az);
  var dx = ax.dot(up), dy = ay.dot(up), dz = az.dot(up);
  if (Math.abs(dy) >= Math.abs(dx) && Math.abs(dy) >= Math.abs(dz)) return dy > 0 ? 2 : 3;
  if (Math.abs(dx) >= Math.abs(dz)) return dx > 0 ? 0 : 1;
  return dz > 0 ? 4 : 5;
}

function showResult(){
  rolling = false;
  rollBtn.disabled = false;
  rolled++;
  roundChip.textContent = 'Round ' + rolled;

  var a = actionsList()[upFaceIndex(die1Body)];
  var b = partsList()[upFaceIndex(die2Body)];
  valA.textContent = a;
  valB.textContent = b;
  resultPh.style.display = 'none';
  rowA.style.display = '';
  rowB.style.display = '';
  resultEl.classList.add('lit');
  resultEl.classList.remove('pop');
  void resultEl.offsetWidth;
  resultEl.classList.add('pop');
}

var lastShake = 0;
function onMotion(e){
  var a = e.acceleration || e.accelerationIncludingGravity;
  if (!a || a.x === null) return;
  var m = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
  var now = performance.now();
  if (m > 18 && now - lastShake > 1500){
    lastShake = now;
    roll();
  }
}
function startMotion(){
  window.addEventListener('devicemotion', onMotion);
  motionOn = true;
  motionHint.textContent = 'Motion controls on \u00b7 shake to roll';
}

function closeGate(status){
  gate.classList.add('hidden');
  if (status) motionHint.textContent = status;
}

function requestMotion(){
  var status = document.getElementById('gateStatus');
  var gateBtn = document.getElementById('enableMotion');
  if (gateBtn) gateBtn.disabled = true;
  if (status) status.textContent = 'Requesting motion access\u2026';
  var done = false;
  var finish = function(granted, msg){
    if (done) return;
    done = true;
    if (gateBtn) gateBtn.disabled = false;
    if (granted){
      startMotion();
      closeGate();
    } else {
      closeGate(msg || 'Motion unavailable \u2014 use Tap to Roll');
    }
  };
  var timer = setTimeout(function(){ finish(false, 'No response from phone \u2014 use Tap to Roll'); }, 8000);
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
      DeviceMotionEvent.requestPermission().then(
        function(r){ clearTimeout(timer); finish(r === 'granted'); },
        function(){ clearTimeout(timer); finish(false, 'Motion blocked \u2014 use Tap to Roll'); }
      );
    } else {
      clearTimeout(timer);
      startMotion();
      closeGate();
    }
  } catch(err){
    clearTimeout(timer);
    finish(false, (err && err.message) || 'Motion error \u2014 use Tap to Roll');
  }
}

document.getElementById('enableMotion').addEventListener('click', requestMotion);
document.getElementById('skipMotion').addEventListener('click', function(){
  closeGate();
});
motionHint.style.pointerEvents = 'auto';
motionHint.style.cursor = 'pointer';
motionHint.addEventListener('click', function(){
  if (!motionOn) requestMotion();
});

rollBtn.addEventListener('click', roll);
window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter') roll();
});

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

var clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  world.step(1/60, dt, 3);

  die1Mesh.position.copy(die1Body.position);
  die1Mesh.quaternion.copy(die1Body.quaternion);
  die2Mesh.position.copy(die2Body.position);
  die2Mesh.quaternion.copy(die2Body.quaternion);

  if (rolling){
    var b1 = die1Body, b2 = die2Body;
    var still =
      b1.velocity.length() < 0.08 && b2.velocity.length() < 0.08 &&
      b1.angularVelocity.length() < 0.1 && b2.angularVelocity.length() < 0.1;
    if (still){
      restFrames++;
    } else {
      restFrames = 0;
    }
    var timeout = performance.now() - rollStart > 8000;
    if (restFrames > 35 || timeout){
      b1.velocity.setZero(); b2.velocity.setZero();
      b1.angularVelocity.setZero(); b2.angularVelocity.setZero();
      showResult();
    }
  }

  renderer.render(scene, camera);
}
animate();

})();
</script>
</body>
</html>
