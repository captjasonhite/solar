<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choplifter</title>
<style>
  html,body{ height:100%; margin:0; background:#0b0f14; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center;
        font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  canvas{ display:block; border-radius:8px; box-shadow:0 20px 80px rgba(0,0,0,.6); }
</style>
</head>
<body>
<canvas id="c" width="960" height="600"></canvas>
<script>
(() => {
"use strict";

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const W = 960, H = 600, WORLD = 2560, GROUND = 540;
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const rand = (a,b) => a + Math.random()*(b-a);
const dist = (a,b,c,d) => Math.hypot(a-c, b-d);

/* ---------- scaling ---------- */
function fit(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H) * 0.97;
  cv.style.width = (W*s)+"px";
  cv.style.height = (H*s)+"px";
}
window.addEventListener("resize", fit);
fit();

/* ---------- audio ---------- */
let AC = null, master = null, engineGain = null, muted = false;
function initAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 1; master.connect(AC.destination);
    const osc = AC.createOscillator(); osc.type = "sawtooth"; osc.frequency.value = 52;
    engineGain = AC.createGain(); engineGain.gain.value = 0;
    const lfo = AC.createOscillator(); lfo.type = "square"; lfo.frequency.value = 14;
    const lfoG = AC.createGain(); lfoG.gain.value = 0.018;
    lfo.connect(lfoG); lfoG.connect(engineGain.gain);
    osc.connect(engineGain); engineGain.connect(master);
    osc.start(); lfo.start();
  }catch(e){ AC = null; }
}
function toggleMute(){ muted = !muted; if(master) master.gain.value = muted ? 0 : 1; }
function beep(f0, f1, dur, type, vol, delay=0){
  if(!AC) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur, vol, freq, delay=0){
  if(!AC) return;
  const t = AC.currentTime + delay;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t);
}
const sfx = {
  shoot:  () => beep(900, 300, 0.06, "square", 0.035),
  hit:    () => { noiseBurst(0.2, 0.2, 900); beep(180, 50, 0.25, "sawtooth", 0.14); },
  boom:   () => { noiseBurst(0.7, 0.35, 420); beep(120, 30, 0.6, "sawtooth", 0.2); },
  pickup: () => { beep(520, 520, 0.09, "square", 0.09); beep(780, 780, 0.12, "square", 0.09, 0.09); },
  drop:   () => { beep(660, 660, 0.08, "square", 0.09); beep(880, 880, 0.08, "square", 0.09, 0.08); beep(1100, 1100, 0.14, "square", 0.09, 0.16); },
  level:  () => { [440,550,660,880].forEach((f,i)=>beep(f, f, 0.12, "square", 0.09, i*0.1)); },
  over:   () => { beep(400, 400, 0.15, "square", 0.1); beep(300, 300, 0.15, "square", 0.1, 0.15); beep(200, 120, 0.5, "sawtooth", 0.12, 0.3); },
  deny:   () => beep(200, 150, 0.12, "square", 0.07),
};

/* ---------- world layout ---------- */
const PAD  = { x0:100, x1:300, y:460 };
const BUILDINGS = [
  { x:2000, w:95, h:85 },
  { x:2190, w:95, h:105 },
  { x:2380, w:95, h:85 }
];
const COMPOUND = { x0:1930, x1:2510 };

/* ---------- state ---------- */
let state = "title";   // title | playing | paused | level | over
let score = 0, hi = +(localStorage.getItem("choplifter.hi") || 0);
let lives = 3, level = 1, rescued = 0, total = 0;
let levelT = 0, time = 0, shake = 0, throttle = 0;
let heli = null, camX = 0;
let emplacements = [], tanks = [], ehelis = [], soldiers = [];
let bullets = [], ebullets = [], parts = [];
let runners = [], cargo = 0;
const CAP = 3;

function newHeli(){
  return { x:200, y:PAD.y-16, vx:0, vy:0, hp:3, fuel:100, face:1,
           rotor:0, alive:true, respawnT:0, inv:0, landed:false,
           boardT:0, dropT:0, fireCd:0 };
}

function countsFor(lv){
  return {
    pows:       Math.min(6 + (lv-1)*2, 12),
    emplacements: Math.min(2 + lv, 8),
    tanks:      Math.min(1 + Math.floor(lv/2), 4),
    ehelis:     Math.min(1 + Math.floor((lv-1)/2), 3),
    soldiers:   Math.min(2 + lv, 8),
    fireMul:    1 + (lv-1)*0.12
  };
}

function startLevel(){
  const c = countsFor(level);
  total = c.pows; rescued = 0; cargo = 0;
  heli = newHeli();

  /* POWs distributed into buildings */
  BUILDINGS.forEach(b => b.pows = 0);
  for(let i=0;i<total;i++) BUILDINGS[i % 3].pows++;

  /* emplacements: guard the approach + patrol the middle field,
     never inside the compound's landing gaps (1890-2000, 2095-2190, 2285-2380, 2475-2550) */
  emplacements = [];
  const eSpots = [1840, 1100, 1450, 900, 650, 1700, 1250, 1550];
  for(let i=0;i<c.emplacements;i++){
    emplacements.push({ x: eSpots[i % eSpots.length] + rand(-12,12), hp:3, cd: rand(0.8, 1.8), flash: 0 });
  }

  /* tanks patrol segments */
  tanks = [];
  /* patrol segments stay west of the compound gaps and clear of the base pad */
  const tSegs = [[750, 1100], [1200, 1600], [1650, 1870], [1350, 1550]];
  for(let i=0;i<c.tanks;i++){
    const s = tSegs[i % tSegs.length];
    tanks.push({ x: rand(s[0], s[1]), x0: s[0], x1: s[1], dir: Math.random()<0.5?-1:1,
                 hp:4, cd: rand(1, 2.5), flash: 0 });
  }

  /* enemy helis */
  ehelis = [];
  for(let i=0;i<c.ehelis;i++){
    ehelis.push({ x: rand(600, 2200), y: rand(110, 300),
                  tx: rand(400, 2300), ty: rand(100, 330),
                  hp:2, cd: rand(1, 2.2), rotor: rand(0, TAU), alive: true });
  }

  /* soldiers: approach + middle field, never inside the landing gaps */
  soldiers = [];
  const sSpots = [1862, 950, 1350, 800, 1150, 1600, 700, 1500];
  for(let i=0;i<c.soldiers;i++){
    soldiers.push({ x: sSpots[i % sSpots.length], face:1, cd: rand(0.8, 2.2), flash: 0 });
  }

  bullets = []; ebullets = []; parts = []; runners = [];
  state = "level"; levelT = 2.4;
}

function startGame(){ score = 0; lives = 3; level = 1; startLevel(); }

function onEnter(){
  initAudio();
  if(AC && AC.state === "suspended") AC.resume();
  if(state === "title" || state === "over") startGame();
}

/* ---------- input ---------- */
const keys = {};
window.addEventListener("keydown", e => {
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if(e.code === "Enter") onEnter();
  if(e.code === "KeyP" && (state === "playing" || state === "paused"))
    state = state === "playing" ? "paused" : "playing";
  if(e.code === "KeyM") toggleMute();
});
window.addEventListener("keyup", e => keys[e.code] = false);
window.addEventListener("blur", () => { for(const k in keys) keys[k] = false; });

/* ---------- particles ---------- */
function boom(x, y, n, c1, c2, spd=180){
  for(let i=0;i<n;i++){
    const a = rand(0, TAU), v = rand(spd*0.3, spd);
    parts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 30,
                 life: rand(0.4, 0.9), max: 0.9, r: rand(2, 6), c: Math.random()<0.5 ? c1 : c2 });
  }
}
function smoke(x, y, n=1){
  for(let i=0;i<n;i++)
    parts.push({ x, y, vx: rand(-14,14), vy: rand(-34,-10),
                 life: rand(0.5, 1.1), max: 1.1, r: rand(3,7), c: "smoke" });
}
function sparks(x, y, n=6){
  for(let i=0;i<n;i++){
    const a = rand(0, TAU), v = rand(40, 160);
    parts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v,
                 life: rand(0.15, 0.4), max: 0.4, r: rand(1, 2.5), c: "#ffe28a" });
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life -= dt;
    if(p.life <= 0){ parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += (p.c === "smoke" ? -18 : 160)*dt;
    p.r += (p.c === "smoke" ? 14 : -3)*dt;
  }
}

/* ---------- heli damage ---------- */
function killHeli(msg){
  const h = heli;
  if(!h.alive) return;
  h.alive = false;
  boom(h.x, h.y, 46, "#ff9a3c", "#ffd24a", 260);
  boom(h.x, h.y, 20, "#555", "#888", 120);
  sfx.boom(); shake = 14;
  /* POWs aboard are lost */
  cargo = 0;
  runners = [];
  lives--;
  if(score > hi){ hi = score; localStorage.setItem("choplifter.hi", hi); }
  if(lives <= 0) state = "over";
  else h.respawnT = 1.8;
}
function hitHeli(){
  const h = heli;
  if(!h.alive || h.inv > 0) return;
  h.hp--; h.inv = 0.7; shake = 7;
  sfx.hit();
  sparks(h.x, h.y, 10);
  if(h.hp <= 0) killHeli();
}

/* ---------- update ---------- */
function update(dt){
  time += dt;
  shake = Math.max(0, shake - dt*30);
  updateParts(dt);

  if(state === "level"){
    levelT -= dt;
    if(levelT <= 0) state = "playing";
    return;
  }
  if(state !== "playing") return;

  const h = heli;

  if(!h.alive){
    h.respawnT -= dt;
    if(h.respawnT <= 0){ heli = newHeli(); }
    updateEnemies(dt);
    return;
  }

  /* --- control --- */
  let ax = 0, ay = 0;
  if(keys.ArrowLeft || keys.KeyA)  ax -= 1;
  if(keys.ArrowRight || keys.KeyD) ax += 1;
  if(keys.ArrowUp || keys.KeyW)    ay -= 1;
  if(keys.ArrowDown || keys.KeyS)  ay += 1;
  if(keys.KeyQ) h.face = -1;
  if(keys.KeyE) h.face = 1;
  const mag = Math.hypot(ax, ay);
  throttle = mag;

  h.vx += ax * 1500 * dt;
  h.vy += ay * 1500 * dt;
  const dmp = Math.exp(-2.4*dt);
  h.vx *= dmp; h.vy *= dmp;
  const sp = Math.hypot(h.vx, h.vy);
  if(sp > 280){ h.vx *= 280/sp; h.vy *= 280/sp; }
  h.x += h.vx*dt; h.y += h.vy*dt;
  h.x = clamp(h.x, 30, WORLD-30);
  if(h.y < 42){ h.y = 42; h.vy = Math.max(0, h.vy); }
  h.rotor += dt * (18 + throttle*22);
  h.inv = Math.max(0, h.inv - dt);
  h.fireCd = Math.max(0, h.fireCd - dt);

  /* --- ground / pad landing (speed matters!) --- */
  h.landed = false;
  const skid = h.y + 16;
  if(skid >= GROUND){
    if(h.vy > 150){ killHeli("hard landing"); return; }
    h.y = GROUND - 16; h.vy = 0; h.landed = true;
  }
  if(h.x > PAD.x0-26 && h.x < PAD.x1+26){
    if(skid >= PAD.y-3 && skid <= PAD.y+12 && h.y <= PAD.y){
      if(h.vy > 150){ killHeli("hard landing"); return; }
      h.y = PAD.y - 16; h.vy = 0; h.landed = true;
    } else if(h.y > PAD.y-8 && skid > PAD.y+4){
      const mid = (PAD.x0+PAD.x1)/2;
      if(h.x < mid){ h.x = PAD.x0-26; h.vx = Math.min(0, h.vx); }
      else         { h.x = PAD.x1+26; h.vx = Math.max(0, h.vx); }
    }
  }

  /* --- buildings: crash on impact --- */
  for(const b of BUILDINGS){
    const top = GROUND - b.h;
    if(h.x+18 > b.x && h.x-18 < b.x+b.w && h.y+14 > top && h.y-14 < GROUND){
      killHeli("crashed into a building"); return;
    }
  }

  /* --- fuel --- */
  if(h.landed && h.x > PAD.x0-10 && h.x < PAD.x1+10){
    h.fuel = Math.min(100, h.fuel + 60*dt);
    if(Math.random() < dt*6) smoke(h.x+26, h.y+10);
  } else if(!h.landed){
    h.fuel -= 3.6*dt;
    if(h.fuel <= 0){
      h.fuel = 0;
      h.vy += 1100*dt;
      if(h.y+16 >= GROUND){ killHeli("out of fuel"); return; }
    }
  }

  /* --- firing --- */
  if(keys.Space && h.fireCd <= 0){
    h.fireCd = 0.22;
    const nx = h.x + h.face*26, ny = h.y - 4;
    bullets.push({ x:nx, y:ny, vx: h.face*640, vy:0 });
    sfx.shoot();
    sparks(nx, ny, 3);
  }

  /* --- boarding at the compound --- */
  const nearCompound = h.x > COMPOUND.x0 - 40 && h.x < COMPOUND.x1 + 40;
  const anyPows = BUILDINGS.some(b => b.pows > 0);
  if(h.landed && nearCompound && cargo < CAP && anyPows && runners.length < 3 - cargo){
    h.boardT += dt;
    if(h.boardT >= 0.45){
      h.boardT = 0;
      /* spawn a runner from the nearest building with POWs */
      let best = null, bd = 1e9;
      for(const b of BUILDINGS){
        if(b.pows <= 0) continue;
        const dx = (b.x + b.w/2) - h.x;
        if(Math.abs(dx) < bd){ bd = Math.abs(dx); best = b; }
      }
      if(best){
        best.pows--;
        runners.push({ x: best.x + best.w/2, y: GROUND, tx: h.x, t: 0, face: h.x > best.x ? 1 : -1 });
      }
    }
  } else h.boardT = 0;

  for(let i=runners.length-1;i>=0;i--){
    const r = runners[i];
    r.t += dt;
    r.x += (r.tx - r.x) * Math.min(dt*4, 1) * 3;
    r.face = r.tx > r.x ? 1 : -1;
    if(Math.abs(r.tx - r.x) < 8){
      runners.splice(i,1);
      cargo++;
      sfx.pickup();
    }
  }

  /* --- unloading at base --- */
  if(h.landed && h.x > PAD.x0-10 && h.x < PAD.x1+10 && cargo > 0){
    h.dropT += dt;
    if(h.dropT >= 0.45){
      h.dropT = 0;
      cargo--; rescued++; score += 100;
      sfx.drop();
      sparks(h.x, h.y-8, 6);
      if(rescued >= total) levelClear();
    }
  } else h.dropT = 0;

  updateEnemies(dt);
  updateBullets(dt);
}

function levelClear(){
  score += 500 + Math.floor(heli.fuel) * 10;
  if(score > hi){ hi = score; localStorage.setItem("choplifter.hi", hi); }
  sfx.level();
  level++;
  startLevel();
}

/* ---------- enemies ---------- */
function updateEnemies(dt){
  const h = heli;
  const c = countsFor(level);

  for(const e of emplacements){
    e.flash = Math.max(0, e.flash - dt);
    e.cd -= dt;
    if(h.alive && dist(e.x, GROUND-14, h.x, h.y) < 430 && e.cd <= 0){
      e.cd = rand(1.0, 1.7) / c.fireMul;
      e.flash = 0.1;
      fireAt(e.x, GROUND-16, h, 300, 0.06);
    }
  }

  for(const t of tanks){
    t.x += t.dir * 32 * dt;
    if(t.x < t.x0){ t.x = t.x0; t.dir = 1; }
    if(t.x > t.x1){ t.x = t.x1; t.dir = -1; }
    t.flash = Math.max(0, t.flash - dt);
    t.cd -= dt;
    if(h.alive && dist(t.x, GROUND-12, h.x, h.y) < 520 && t.cd <= 0){
      t.cd = rand(1.5, 2.4) / c.fireMul;
      t.flash = 0.1;
      fireAt(t.x + t.dir*20, GROUND-16, h, 270, 0.05);
    }
  }

  for(const s of soldiers){
    s.flash = Math.max(0, s.flash - dt);
    s.cd -= dt;
    if(h.alive){
      s.face = h.x > s.x ? 1 : -1;
      if(dist(s.x, GROUND-10, h.x, h.y) < 320 && s.cd <= 0){
        s.cd = rand(1.2, 2.0) / c.fireMul;
        s.flash = 0.1;
        fireAt(s.x + s.face*10, GROUND-12, h, 280, 0.07);
      }
    }
  }

  for(const e of ehelis){
    if(!e.alive) continue;
    e.rotor += dt*20;
    const dx = e.tx - e.x, dy = e.ty - e.y;
    const d = Math.hypot(dx, dy);
    if(d < 30){ e.tx = rand(400, 2350); e.ty = rand(100, 330); }
    else { e.x += dx/d*95*dt; e.y += dy/d*95*dt; }
    e.cd -= dt;
    if(h.alive && dist(e.x, e.y, h.x, h.y) < 340 && e.cd <= 0){
      e.cd = rand(1.1, 1.9) / c.fireMul;
      fireAt(e.x, e.y+8, h, 310, 0.06);
    }
  }
}

function fireAt(x, y, h, spd, inacc){
  const a = Math.atan2(h.y - y, h.x - x) + rand(-inacc, inacc);
  ebullets.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd });
  sfx.shoot();
}

function updateBullets(dt){
  /* player bullets */
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt;
    if(b.x < -20 || b.x > WORLD+20){ bullets.splice(i,1); continue; }
    let hit = false;

    for(const e of emplacements){
      if(!hit && Math.abs(b.x - e.x) < 16 && b.y > GROUND-34 && b.y < GROUND){
        e.hp--; sparks(b.x, b.y); hit = true;
        if(e.hp <= 0){ score += 200; boom(e.x, GROUND-14, 26, "#ff9a3c", "#ffd24a"); sfx.boom(); shake = 5; }
      }
    }
    for(const t of tanks){
      if(!hit && Math.abs(b.x - t.x) < 24 && b.y > GROUND-26 && b.y < GROUND){
        t.hp--; sparks(b.x, b.y); hit = true;
        if(t.hp <= 0){ score += 300; boom(t.x, GROUND-12, 30, "#ff9a3c", "#ffd24a"); sfx.boom(); shake = 6; }
      }
    }
    for(const e of ehelis){
      if(!hit && e.alive && dist(b.x, b.y, e.x, e.y) < 18){
        e.hp--; sparks(b.x, b.y); hit = true;
        if(e.hp <= 0){
          e.alive = false; score += 500;
          boom(e.x, e.y, 30, "#ff9a3c", "#ffd24a"); sfx.boom(); shake = 6;
        }
      }
    }
    for(const s of soldiers){
      if(!hit && Math.abs(b.x - s.x) < 8 && b.y > GROUND-24 && b.y < GROUND){
        sparks(b.x, b.y); hit = true;
        score += 50;
        s.dead = true;
      }
    }
    /* buildings block bullets */
    for(const bd of BUILDINGS){
      if(!hit && b.x > bd.x && b.x < bd.x+bd.w && b.y > GROUND-bd.h && b.y < GROUND){
        sparks(b.x, b.y); hit = true;
      }
    }
    if(!hit && b.y >= GROUND){ sparks(b.x, GROUND); hit = true; }

    if(hit){
      /* remove destroyed */
      for(let j=emplacements.length-1;j>=0;j--) if(emplacements[j].hp<=0) emplacements.splice(j,1);
      for(let j=tanks.length-1;j>=0;j--) if(tanks[j].hp<=0) tanks.splice(j,1);
      for(let j=soldiers.length-1;j>=0;j--) if(soldiers[j].dead) soldiers.splice(j,1);
      bullets.splice(i,1);
    }
  }

  /* enemy bullets */
  const h = heli;
  for(let i=ebullets.length-1;i>=0;i--){
    const b = ebullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.x < -20 || b.x > WORLD+20 || b.y < -20 || b.y > H+20){ ebullets.splice(i,1); continue; }
    if(b.y >= GROUND){ sparks(b.x, GROUND, 3); ebullets.splice(i,1); continue; }
    /* buildings block enemy fire too — cover works both ways */
    let blocked = false;
    for(const bd of BUILDINGS){
      if(b.x > bd.x && b.x < bd.x+bd.w && b.y > GROUND-bd.h && b.y < GROUND){
        sparks(b.x, b.y, 3); blocked = true; break;
      }
    }
    if(blocked){ ebullets.splice(i,1); continue; }
    if(h.alive && dist(b.x, b.y, h.x, h.y) < 22){
      ebullets.splice(i,1);
      hitHeli();
    }
  }
}

/* ---------- scenery ---------- */
function tree(x, y, s){
  ctx.fillStyle = "#5a3d24";
  ctx.fillRect(x-3*s, y-14*s, 6*s, 14*s);
  ctx.fillStyle = "#1d5c33";
  ctx.beginPath(); ctx.arc(x, y-20*s, 14*s, 0, TAU); ctx.fill();
  ctx.fillStyle = "#277142";
  ctx.beginPath(); ctx.arc(x-8*s, y-14*s, 10*s, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x+8*s, y-15*s, 10*s, 0, TAU); ctx.fill();
}
function crater(x, w){
  ctx.fillStyle = "#2f6339";
  ctx.beginPath(); ctx.ellipse(x, GROUND+8, w, 7, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#275431";
  ctx.beginPath(); ctx.ellipse(x, GROUND+8, w*0.6, 4, 0, 0, TAU); ctx.fill();
}

function drawSky(){
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, "#6db9e8");
  sky.addColorStop(0.6, "#a8d8ea");
  sky.addColorStop(1, "#d8ecc8");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND);
  ctx.fillStyle = "rgba(255,244,200,0.9)";
  ctx.beginPath(); ctx.arc(860, 80, 34, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(255,244,200,0.25)";
  ctx.beginPath(); ctx.arc(860, 80, 52, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  const ct = time * 6;
  for(const [bx, by, s] of [[120, 90, 1], [420, 140, 0.8], [700, 60, 1.2]]){
    const cx = ((bx + ct*s) % (W+200)) - 100;
    ctx.beginPath();
    ctx.arc(cx, by, 18*s, 0, TAU);
    ctx.arc(cx+22*s, by-8*s, 15*s, 0, TAU);
    ctx.arc(cx+44*s, by, 17*s, 0, TAU);
    ctx.fill();
  }
}

function drawWorld(){
  const cx = camX;

  /* far mountains, slow parallax */
  ctx.save();
  ctx.translate(-cx*0.25, 0);
  ctx.fillStyle = "#5d946c";
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  for(let x=0;x<=WORLD*0.4+W;x+=14){
    ctx.lineTo(x, GROUND - 90 - 55*Math.sin(x*0.006) - 30*Math.sin(x*0.017+2));
  }
  ctx.lineTo(WORLD*0.4+W, GROUND); ctx.closePath(); ctx.fill();
  ctx.restore();

  /* mid hills */
  ctx.save();
  ctx.translate(-cx*0.55, 0);
  ctx.fillStyle = "#4a8a5c";
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  for(let x=0;x<=WORLD*0.55+W;x+=12){
    ctx.lineTo(x, GROUND - 45 - 30*Math.sin(x*0.01+1) - 18*Math.sin(x*0.028));
  }
  ctx.lineTo(WORLD*0.55+W, GROUND); ctx.closePath(); ctx.fill();
  ctx.restore();

  /* ground */
  ctx.fillStyle = "#3e7d47";
  ctx.fillRect(0, GROUND, W, H-GROUND);
  ctx.fillStyle = "#2f6339";
  ctx.fillRect(0, GROUND+26, W, H-GROUND-26);

  ctx.save();
  ctx.translate(-cx, 0);

  /* craters + trees (fixed world positions) */
  crater(520, 34); crater(980, 26); crater(1420, 40); crater(1750, 30);
  tree(430, GROUND, 1.0); tree(760, GROUND, 0.8); tree(1180, GROUND, 1.1);
  tree(1560, GROUND, 0.9); tree(1870, GROUND, 1.0); tree(2540, GROUND, 1.1);

  /* --- base --- */
  ctx.fillStyle = "#8d9aa5";
  ctx.fillRect(40, 470, 70, GROUND-470);
  ctx.fillStyle = "#77848f";
  ctx.fillRect(40, 470, 70, 10);
  ctx.fillStyle = "#4c5860";
  ctx.fillRect(56, 500, 16, GROUND-500);
  ctx.fillStyle = "#e8524a";
  ctx.fillRect(68, 482, 10, 4); ctx.fillRect(71, 479, 4, 10);
  ctx.fillStyle = "#b0653a";
  ctx.beginPath(); ctx.ellipse(330, 512, 15, 26, 0, 0, TAU); ctx.fill();
  /* helipad */
  ctx.fillStyle = "#7d8790";
  ctx.fillRect(PAD.x0, PAD.y, PAD.x1-PAD.x0, 12);
  ctx.fillStyle = "#6a747d";
  ctx.fillRect(PAD.x0, PAD.y+12, PAD.x1-PAD.x0, GROUND-PAD.y-12);
  ctx.strokeStyle = "#ffd24a";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(200, PAD.y+6, 26, 7, 0, 0, TAU); ctx.stroke();
  ctx.fillStyle = "#ffd24a";
  ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("H", 200, PAD.y+10);
  hudTextWorld("BASE — REFUEL & UNLOAD", 200, 430, "center", 11, "rgba(255,255,255,0.5)");

  /* --- compound --- */
  hudTextWorld("POW COMPOUND", 2230, 330, "center", 12, "rgba(255,255,255,0.55)");
  for(const b of BUILDINGS){
    const top = GROUND - b.h;
    ctx.fillStyle = "#9a8f7a";
    ctx.fillRect(b.x, top, b.w, b.h);
    ctx.fillStyle = "#847a66";
    ctx.fillRect(b.x, top, b.w, 8);
    /* windows with POWs */
    const rows = Math.floor(b.h/34);
    let shown = 0;
    for(let r=0;r<rows && shown < b.pows;r++){
      for(let cix=0;cix<2 && shown < b.pows;cix++){
        const wx = b.x + 18 + cix*44, wy = top + 20 + r*34;
        ctx.fillStyle = "#3a3f45";
        ctx.fillRect(wx, wy, 26, 20);
        const px = wx + 13, py = wy + 18;
        ctx.fillStyle = "#3a6ea8";
        ctx.fillRect(px-4, py-9, 8, 8);
        ctx.fillStyle = "#e8b88a";
        ctx.beginPath(); ctx.arc(px, py-12, 3.5, 0, TAU); ctx.fill();
        shown++;
      }
    }
    /* door */
    ctx.fillStyle = "#4c4238";
    ctx.fillRect(b.x + b.w/2 - 10, GROUND-26, 20, 26);
    /* sandbags */
    ctx.fillStyle = "#b3a582";
    for(let x=b.x-14; x<b.x+b.w+10; x+=12){
      ctx.beginPath(); ctx.arc(x, GROUND-4, 6, 0, TAU); ctx.fill();
    }
  }

  /* --- emplacements --- */
  for(const e of emplacements){
    ctx.fillStyle = "#5f6f52";
    ctx.beginPath(); ctx.ellipse(e.x, GROUND-6, 16, 9, 0, 0, TAU); ctx.fill();
    ctx.save();
    ctx.translate(e.x, GROUND-12);
    const h = heli;
    const a = h.alive ? Math.atan2(h.y-(GROUND-14), h.x-e.x) : 0;
    ctx.rotate(clamp(a, -1.2, 1.2));
    ctx.fillStyle = "#46543c";
    ctx.fillRect(0, -2.5, 20, 5);
    if(e.flash > 0){
      ctx.fillStyle = "#ffe28a";
      ctx.beginPath(); ctx.arc(22, 0, 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  /* --- tanks --- */
  for(const t of tanks){
    ctx.fillStyle = "#5c6b4a";
    ctx.beginPath();
    ctx.moveTo(t.x-22, GROUND); ctx.lineTo(t.x-16, GROUND-10);
    ctx.lineTo(t.x+16, GROUND-10); ctx.lineTo(t.x+22, GROUND);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#4a573c";
    ctx.fillRect(t.x-12, GROUND-20, 24, 11);
    ctx.save();
    ctx.translate(t.x, GROUND-16);
    const h = heli;
    const a = h.alive ? Math.atan2(h.y-(GROUND-16), h.x-t.x) : t.dir;
    ctx.rotate(clamp(a, -1.1, 1.1));
    ctx.fillStyle = "#39432e";
    ctx.fillRect(0, -2, 24, 4);
    if(t.flash > 0){
      ctx.fillStyle = "#ffe28a";
      ctx.beginPath(); ctx.arc(26, 0, 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
    /* wheels */
    ctx.fillStyle = "#2c3325";
    for(let i=-2;i<=2;i++){
      ctx.beginPath(); ctx.arc(t.x+i*9, GROUND-4, 4.5, 0, TAU); ctx.fill();
    }
  }

  /* --- soldiers --- */
  for(const s of soldiers){
    drawFigure(s.x, GROUND, "#4a5d3a", "#c8a07a", s.face, s.flash > 0, true);
  }

  /* --- POW runners --- */
  for(const r of runners){
    drawFigure(r.x, GROUND, "#3a6ea8", "#e8b88a", r.face, false, false, Math.sin(time*14)*0.5);
  }

  /* --- enemy helis --- */
  for(const e of ehelis){
    if(!e.alive) continue;
    drawEHeli(e);
  }

  /* --- bullets --- */
  for(const b of ebullets){
    ctx.strokeStyle = "rgba(255,210,74,0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx*0.03, b.y - b.vy*0.03);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.fillStyle = "#ffd24a";
    ctx.beginPath(); ctx.arc(b.x, b.y, 2.4, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = "#aef2ff";
  for(const b of bullets){
    ctx.fillRect(b.x-6, b.y-1.5, 12, 3);
  }

  /* --- helicopter --- */
  drawHeli(heli);

  /* --- particles --- */
  for(const p of parts){
    const a = clamp(p.life / p.max, 0, 1);
    if(p.c === "smoke"){
      ctx.fillStyle = `rgba(120,120,125,${(a*0.5).toFixed(3)})`;
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.c;
      ctx.globalAlpha = 1;
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(p.r, 0.5), 0, TAU); ctx.fill();
  }

  ctx.restore();
}

function hudTextWorld(str, x, y, align, size, col, weight="600"){
  ctx.font = `${weight} ${size}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.fillStyle = col;
  ctx.fillText(str, x, y);
}

function drawFigure(x, y, body, skin, face, flash, gun, run=0){
  ctx.fillStyle = body;
  ctx.fillRect(x-4, y-14, 8, 10);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(x-4, y-4, 3, 5);
  ctx.fillRect(x+1, y-4, 3, 5);
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(x, y-18, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = body;
  ctx.fillRect(x-5, y-23, 10, 4);
  if(gun){
    ctx.save();
    ctx.translate(x, y-11);
    ctx.scale(face, 1);
    ctx.fillStyle = "#222";
    ctx.fillRect(0, -1.5, 13, 3);
    if(flash){
      ctx.fillStyle = "#ffe28a";
      ctx.beginPath(); ctx.arc(15, 0, 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

function drawEHeli(e){
  ctx.save();
  ctx.translate(e.x, e.y);
  const h = heli;
  if(h && h.alive) ctx.scale(h.x > e.x ? 1 : -1, 1);
  ctx.fillStyle = "#5a6b52";
  ctx.fillRect(-26, -3, 18, 5);
  ctx.fillRect(-28, -9, 4, 10);
  ctx.fillStyle = "#67795c";
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#3a4a35";
  ctx.beginPath(); ctx.ellipse(8, -2, 6, 4, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#3a4a35"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-10, 11); ctx.lineTo(12, 11); ctx.stroke();
  const rw = Math.cos(e.rotor) * 22;
  ctx.strokeStyle = "rgba(40,50,38,0.8)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-rw, -11); ctx.lineTo(rw, -11); ctx.stroke();
  ctx.restore();
}

function drawHeli(h){
  if(!h || !h.alive) return;
  const x = h.x, y = h.y;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(h.face, 1);
  if(h.inv > 0 && Math.floor(time*30) % 2 === 0) ctx.globalAlpha = 0.45;

  /* tail boom */
  ctx.fillStyle = "#c8452e";
  ctx.beginPath();
  ctx.moveTo(-14, -2); ctx.lineTo(-34, -5); ctx.lineTo(-34, 2); ctx.lineTo(-14, 5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#a83420";
  ctx.beginPath();
  ctx.moveTo(-34, -8); ctx.lineTo(-30, 6); ctx.lineTo(-37, 6); ctx.lineTo(-39, -6);
  ctx.closePath(); ctx.fill();
  const tr = Math.sin(h.rotor*2) * 7;
  ctx.strokeStyle = "rgba(60,20,12,0.7)"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-37, -8+tr); ctx.lineTo(-37, 8-tr); ctx.stroke();

  /* body */
  ctx.fillStyle = "#e05a3a";
  ctx.beginPath(); ctx.ellipse(2, 0, 20, 12, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#bfe8f5";
  ctx.beginPath(); ctx.ellipse(12, -3, 8, 6.5, -0.2, 0, TAU); ctx.fill();
  ctx.fillStyle = "#f5f0e6";
  ctx.fillRect(-12, 3, 26, 4);
  /* nose gun */
  ctx.fillStyle = "#4a2015";
  ctx.fillRect(18, -2, 10, 4);
  if(h.fireCd > 0.15){
    ctx.fillStyle = "#ffe28a";
    ctx.beginPath(); ctx.arc(30, 0, 5, 0, TAU); ctx.fill();
  }

  /* skids */
  ctx.strokeStyle = "#5a2a1a"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-14, 15); ctx.lineTo(18, 15); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(-10, 14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(12, 14); ctx.stroke();

  /* main rotor */
  const rw = Math.cos(h.rotor) * 34;
  ctx.strokeStyle = "rgba(40,18,10,0.85)"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-rw, -14); ctx.lineTo(rw, -14); ctx.stroke();
  ctx.fillStyle = "#5a2a1a";
  ctx.fillRect(-2, -17, 4, 4);

  /* cargo */
  for(let i=0;i<cargo;i++){
    const cx = -6 + i*7;
    ctx.fillStyle = "#3a6ea8";
    ctx.fillRect(cx, 12, 6, 7);
    ctx.fillStyle = "#e8b88a";
    ctx.beginPath(); ctx.arc(cx+3, 9, 2.6, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* boarding / unloading progress */
  if(h.boardT > 0) progress(x, y-36, h.boardT/0.45, "#7ec8ff");
  if(h.dropT > 0)  progress(x, y-36, h.dropT/0.45, "#7dff9a");
}
function progress(x, y, f, c){
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.fillRect(x-20, y, 40, 6);
  ctx.fillStyle = c;
  ctx.fillRect(x-19, y+1, 38*f, 4);
}

/* ---------- HUD ---------- */
function hudText(str, x, y, align="left", size=13, col="#fff", weight="600"){
  ctx.font = `${weight} ${size}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillText(str, x+1.5, y+1.5);
  ctx.fillStyle = col;
  ctx.fillText(str, x, y);
}

function drawHUD(){
  ctx.fillStyle = "rgba(8,12,20,0.55)";
  ctx.fillRect(0, 0, W, 34);
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  ctx.fillRect(0, 34, W, 1);

  hudText("SCORE " + String(score).padStart(6, "0"), 16, 18);
  hudText("HI " + String(hi).padStart(6, "0"), 168, 18, "left", 13, "#9fb4d8");
  hudText("LEVEL " + level, 300, 18, "left", 13, "#ffd24a");
  hudText("POWS " + rescued + "/" + total, 400, 18, "left", 13, "#7dff9a");
  hudText("ABOARD " + cargo + "/" + CAP, 500, 18, "left", 13, "#7ec8ff");

  hudText("FUEL", 620, 18, "left", 11, "#9fb4d8");
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fillRect(658, 11, 100, 12);
  const f = heli ? heli.fuel/100 : 0;
  ctx.fillStyle = f > 0.35 ? "#7dff9a" : (Math.floor(time*4)%2 ? "#ff5a4a" : "#ffd24a");
  ctx.fillRect(660, 13, 96*f, 8);

  /* armor pips */
  for(let i=0;i<3;i++){
    ctx.fillStyle = heli && i < heli.hp ? "#e05a3a" : "rgba(255,255,255,0.15)";
    ctx.fillRect(790 + i*14, 12, 10, 10);
  }
  /* lives */
  for(let i=0;i<3;i++){
    const x = 860 + i*30;
    ctx.fillStyle = i < lives ? "#e05a3a" : "rgba(255,255,255,0.15)";
    ctx.beginPath(); ctx.ellipse(x, 18, 9, 5.5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x-11, 10); ctx.lineTo(x+11, 10); ctx.stroke();
  }
  if(muted) hudText("MUTED", W-12, 18, "right", 11, "#9fb4d8");
}

/* ---------- screens ---------- */
function drawTitle(){
  drawSky();
  ctx.fillStyle = "#3e7d47";
  ctx.fillRect(0, GROUND, W, H-GROUND);
  ctx.fillStyle = "rgba(6,10,18,0.72)";
  ctx.fillRect(0, 0, W, H);

  const h = { x: W/2, y: 190 + Math.sin(time*1.6)*8, rotor: time*22, face:1,
              cargo:0, flash:0, alive:true, inv:0, fireCd:0 };
  drawHeli(h);

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "900 58px -apple-system, 'Segoe UI', Roboto, sans-serif";
  ctx.fillStyle = "#e05a3a";
  ctx.fillText("CH OPLIFTER", W/2 + 3, 300);
  ctx.fillStyle = "#ffd24a";
  ctx.fillText("CH OPLIFTER", W/2, 297);

  hudText("rescue the POWs from the compound — bring them home alive", W/2, 345, "center", 15, "#9fb4d8", "400");

  hudText("ARROWS / WASD  fly        Q / E  turn nose        SPACE  fire", W/2, 405, "center", 14, "#dfe6f5");
  hudText("shoot the tanks and AA guns guarding the compound", W/2, 432, "center", 14, "#dfe6f5");
  hudText("land SOFT near the buildings — POWs run to you (3 aboard max)", W/2, 459, "center", 14, "#dfe6f5");
  hudText("touch down fast or hit a building and you crash — POWs lost", W/2, 486, "center", 14, "#dfe6f5");
  hudText("return to the H pad to unload and refuel", W/2, 513, "center", 14, "#dfe6f5");

  if(Math.floor(time*2) % 2 === 0)
    hudText("PRESS ENTER TO START", W/2, 556, "center", 18, "#7dff9a", "700");
  hudText("P pause   M mute", W/2, 582, "center", 11, "#66748c");
}

function drawLevelBanner(){
  ctx.fillStyle = "rgba(6,10,18,0.5)";
  ctx.fillRect(0, H/2-56, W, 112);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 44px -apple-system, 'Segoe UI', Roboto, sans-serif";
  ctx.fillStyle = "#ffd24a";
  ctx.fillText("LEVEL " + level, W/2, H/2 - 10);
  hudText(total + " POWs in the compound to the east — clear the defenses, get them out!", W/2, H/2 + 30, "center", 15, "#dfe6f5", "400");
}

function drawOver(){
  ctx.fillStyle = "rgba(6,10,18,0.75)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "900 54px -apple-system, 'Segoe UI', Roboto, sans-serif";
  ctx.fillStyle = "#ff5a4a";
  ctx.fillText("GAME OVER", W/2, 240);
  hudText("FINAL SCORE  " + score, W/2, 310, "center", 22, "#fff");
  hudText("HI SCORE  " + hi, W/2, 344, "center", 16, "#9fb4d8");
  hudText("reached level " + level + "  ·  " + rescued + " POWs rescued this run", W/2, 380, "center", 14, "#66748c", "400");
  if(Math.floor(time*2) % 2 === 0)
    hudText("PRESS ENTER TO FLY AGAIN", W/2, 450, "center", 18, "#7dff9a", "700");
}

function drawPaused(){
  ctx.fillStyle = "rgba(6,10,18,0.6)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 40px -apple-system, 'Segoe UI', Roboto, sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText("PAUSED", W/2, H/2 - 10);
  hudText("press P to resume", W/2, H/2 + 30, "center", 14, "#9fb4d8", "400");
}

/* ---------- main loop ---------- */
function render(){
  if(state === "title"){
    drawTitle();
    return;
  }

  /* camera */
  const target = clamp(heli.x - W/2, 0, WORLD - W);
  camX += (target - camX) * 0.12;

  ctx.save();
  if(shake > 0) ctx.translate(rand(-shake, shake)*0.5, rand(-shake, shake)*0.5);
  drawSky();
  drawWorld();
  ctx.restore();

  drawHUD();
  if(state === "level") drawLevelBanner();
  if(state === "paused") drawPaused();
  if(state === "over") drawOver();

  if(state === "playing" && heli && heli.alive){
    if(heli.fuel < 25)
      hudText("LOW FUEL — HEAD FOR THE H PAD!", W/2, 58, "center", 15, "#ff5a4a", "700");
  }
}

let last = performance.now();
function frame(now){
  const dt = Math.min((now - last)/1000, 0.05);
  last = now;
  update(dt);

  if(engineGain){
    const on = state === "playing" && heli && heli.alive;
    const target = on ? 0.028 + throttle*0.03 : 0;
    engineGain.gain.value += (target - engineGain.gain.value) * Math.min(dt*8, 1);
  }

  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
